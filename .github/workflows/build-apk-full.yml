name: Build APK (full)

# 完整版：带上端上运行环境（Ubuntu + Node + DSH 的 rootfs + proot），
# 支持「本机模式」。构建比精简版慢很多（40–60 分钟），所以单独一个工作流。
#
# 发布为正式 Release（占 latest），App 内自更新的目标就是它。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布成 Release 的 tag，例如 v1.0.18-full（留空只构建）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # rootfs 下载与 npm 树很大，缓存命中能省掉大半时间
      - name: Cache runtime inputs
        uses: actions/cache@v4
        with:
          path: |
            runtime/.cache
            runtime/out
            runtime/out-tawcroot
          key: runtime-arm64-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/patches/**') }}
          restore-keys: |
            runtime-arm64-

      - name: Show toolchain
        run: |
          flutter --version
          node --version
          npm --version
          python3 --version
          command -v gpgv xz curl

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::完整版必须用固定签名，否则不能覆盖升级"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/release.jks
          cat > app/android/key.properties <<EOF
          storeFile=../release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名密钥已就位：$(stat -c %s app/android/release.jks) 字节"

      # 上游 tooling/build-apk.sh 在 release 构建前做这三步，这里照做
      - name: Build bundled runtime (arm64)
        run: |
          set -euo pipefail
          chmod +x runtime/build-runtime.sh
          runtime/build-runtime.sh arm64-v8a
          du -sh runtime/out runtime/out/arm64-v8a 2>/dev/null || true

      - name: Build libtawcroot
        run: python3 runtime/tawcroot/build.py

      - name: Check runtime bundle
        run: python3 tooling/check_runtime_bundle.py arm64

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build arm64 release APK
        working-directory: app
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date -u +%m%d%H%M)
          echo "versionCode=$BUILD_NUMBER"
          flutter build apk \
            --release \
            --flavor arm64 \
            --build-number "$BUILD_NUMBER" \
            --dart-define=DSH_UPDATE_MIRROR= \
            --dart-define=DSH_UPDATE_FEED= \
            --dart-define=DSH_UPDATE_MIRRORS=
          ls -lh build/app/outputs/flutter-apk/

      - name: Verify signature
        working-directory: app
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*-arm64-release.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-full-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p /tmp/rel
          cp "$(ls build/app/outputs/flutter-apk/*-arm64-release.apk | head -1)" "/tmp/rel/dsh-go-${VERSION}-arm64.apk"
          cat > /tmp/notes.md <<EOF
          **完整版（正式发布）**：内置端上运行环境（Ubuntu + Node + DSH），支持本机模式。

          - 版本：${VERSION}
          - 构建：GitHub Actions，Flutter 3.47.7 + JDK 17
          - ABI：arm64-v8a（Android 8.0+）
          - 正式发布版，占 /releases/latest，App 内自更新默认装这个
          - 签名与精简版相同，可互相覆盖安装
          - 许可证：AGPL-3.0
          EOF
          gh release create "$TAG" "/tmp/rel/dsh-go-${VERSION}-arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-Go ${VERSION} 完整版" \
            --notes-file /tmp/notes.md \
            --latest
