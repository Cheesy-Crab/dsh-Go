name: Build APK (slim)

# 上游没有 APK 的 CI（只在本地跑 tooling/build-apk.sh）。
# 这里补云端构建，并在手动触发时发布 Release，供 App 内自更新使用。
#
# 自更新依赖三件事，缺一不可：
#   1. app/lib/update/update_config.dart 里的 updateRepo 指向本 fork
#   2. 资产名符合上游约定：dsh-go-<version>-arm64.apk
#   3. 签名固定：所有构建用同一个 keystore，否则装不上（Android 拒绝签名不同的覆盖）
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布成 Release 的 tag，例如 v1.0.17（留空只构建）'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # 签名密钥放在仓库 secrets 里（base64），没有就退回 debug 签名——
      # debug 签名的包装不上正式版，只适合临时验证。
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置签名密钥，本次用 debug 签名（无法覆盖升级）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/android/release.jks
          cat > app/android/key.properties <<EOF
          storeFile=../release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名密钥已就位：$(ls -l app/android/release.jks | awk '{print $5}') 字节"

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build arm64 release APK
        working-directory: app
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(date -u +%m%d%H%M)
          echo "versionCode=$BUILD_NUMBER"
          # 关掉上游的自建镜像/子频道/加速器：否则它会先问 dl.dshtui.com，
          # 拿到的是上游版本，而不是我们这个 fork 的。
          flutter build apk \
            --release \
            --flavor arm64 \
            --build-number "$BUILD_NUMBER" \
            --dart-define=DSH_UPDATE_MIRROR= \
            --dart-define=DSH_UPDATE_FEED= \
            --dart-define=DSH_UPDATE_MIRRORS=
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # 资产名必须符合上游约定 dsh-go-<version>-arm64.apk，
      # App 的 updater 就是按这个正则找包的。
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "版本: $VERSION"
          mkdir -p /tmp/rel
          cp "$(ls build/app/outputs/flutter-apk/*-arm64-release.apk | head -1)" "/tmp/rel/dsh-go-${VERSION}-arm64.apk"
          ls -lh /tmp/rel/
          cat > /tmp/notes.md <<EOF
          **精简版**：不含端上运行环境，适合「改用远程主机」连接电脑的用法。完整版（带本机模式）见 Build APK (full)。

          - 自更新源：本仓库的 latest release
          - 构建：GitHub Actions，Flutter 3.47.7 + JDK 17
          - ABI：arm64-v8a（Android 8.0+）
          - 签名与官方版不同：**首次安装需先卸载官方版**，之后可在 App 内升级
          - 许可证：AGPL-3.0（随源仓库）
          EOF
          gh release create "$TAG" "/tmp/rel/dsh-go-${VERSION}-arm64.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-Go ${VERSION}（fork）" \
            --notes-file /tmp/notes.md \
            --latest
