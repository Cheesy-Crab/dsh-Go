name: Build APK

# 上游没有 APK 的 CI，只在本地用 tooling/build-apk.sh（Linux 专用）。
# 这里补一个云端构建：推代码就能拿到可安装的 arm64 release APK。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version && java -version

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # versionCode 用构建时间戳（MMDDHHmm），保证每次安装都能覆盖升级
      - name: Build arm64 release APK
        working-directory: app
        run: |
          BUILD_NUMBER=$(date -u +%m%d%H%M)
          echo "versionCode=$BUILD_NUMBER"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-number "$BUILD_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
