name: Build APK

# 上游没有 APK 的 CI，只在本地用 tooling/build-apk.sh（Linux 专用）。
# 这里补一个云端构建：推代码就能拿到可安装的 arm64 release APK。
# 手动触发时填 release_tag，还会把 APK 发布成 Release（免登录直链）。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布成 Release 的 tag，例如 v1.0.16-fork.1（留空只构建）'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version && java -version

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 这个工程按 ABI 分了 arm64 / x64 两个 flavor，必须显式 --flavor，
      # 否则 flutter 会去找不存在的 assembleRelease 任务。
      # versionCode 用构建时间戳（MMDDHHmm），保证覆盖升级时递增。
      - name: Build arm64 release APK
        working-directory: app
        run: |
          BUILD_NUMBER=$(date -u +%m%d%H%M)
          echo "versionCode=$BUILD_NUMBER"
          flutter build apk \
            --release \
            --flavor arm64 \
            --build-number "$BUILD_NUMBER"
          echo "--- 产物 ---"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # 手动触发且填了 tag 时，直接把 APK 发成 Release。
      # 资产名固定为 dsh-go-arm64.apk，于是 /releases/latest/download/dsh-go-arm64.apk 永远可用。
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p /tmp/rel
          # 资产名要固定，否则 /releases/latest/download/<名字> 会随 flavor 输出名漂移
          cp "$(ls build/app/outputs/flutter-apk/*-arm64-release.apk | head -1)" /tmp/rel/dsh-go-arm64.apk
          ls -lh /tmp/rel/dsh-go-arm64.apk
          cat > /tmp/notes.md <<'EOF'
          基于上游 `ccch1mneyyy/dsh-Go` 的 fork 构建，未改业务代码。

          - 构建：GitHub Actions，Flutter 3.47.7 + JDK 17
          - ABI：arm64-v8a（Android 8.0+）
          - 与官方包签名不同，**不能覆盖安装**，需要先卸载官方版
          - 许可证：AGPL-3.0（随源仓库）
          EOF
          gh release create "$TAG" /tmp/rel/dsh-go-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-Go ${TAG}（fork 构建）" \
            --notes-file /tmp/notes.md \
            --latest

      # 再补上静态更新源需要的两个资产：app.apk + update.json
      # versionCode 从 APK 里读，保证和安装后的包一致
      - name: Attach update manifest
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging /tmp/rel/dsh-go-arm64.apk | head -1)
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "versionCode=$CODE versionName=$NAME"
          cp /tmp/rel/dsh-go-arm64.apk /tmp/rel/app.apk
          SIZE=$(stat -c %s /tmp/rel/app.apk)
          SHA=$(sha256sum /tmp/rel/app.apk | cut -d' ' -f1)
          python3 - "$TAG" "$CODE" "$NAME" "$SIZE" "$SHA" > /tmp/rel/update.json <<'PY'
          import json, sys, datetime
          tag, code, name, size, sha = sys.argv[1:6]
          print(json.dumps({
              "versionCode": int(code),
              "versionName": name,
              "sizeBytes": int(size),
              "sha256": sha,
              "notes": f"fork 构建 {tag}：基于上游 ccch1mneyyy/dsh-Go，未改业务代码。",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "url": "app.apk",
          }, ensure_ascii=False, indent=2))
          PY
          cat /tmp/rel/update.json
          gh release upload "$TAG" /tmp/rel/app.apk /tmp/rel/update.json \
            --repo "$GITHUB_REPOSITORY" --clobber
